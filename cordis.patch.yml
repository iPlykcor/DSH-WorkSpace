# dsh-octopus-operation-space bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package: when
# the plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-octopus-operation-space@<version>
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-octopus-operation-space` to the
# bundle stack. The profile boot then merges THIS patch (a single `insert` of
# the plugin row). No profile file edits needed — one command installs and
# mounts.
#
# If the profile still carries a manual mount line for this package in its own
# cordis.patch.yml, remove it before switching to the bundle channel to avoid
# double-mounting (two Node halves, two sidebar tabs).
#
# Aggregate double-mount guard: aggregate bundles may already mount this
# package under their own entry id. Two mounts register the same /octopus/api
# prefix twice and fail the whole plugin tree at boot ("duplicate prefix
# route"). The `!!js` disabled expression backs THIS row off when another
# *enabled* entry already mounts `dsh-octopus-operation-space`; the aggregate
# instance then owns the plugin. The loader evaluates it when this row is
# processed (entry-list order, only rows before this one are visible), so the
# aggregate bundle must precede this one in `dsh.profile.bundles` — the
# standard install order, since `dsh plugin add` appends new bundles last.
# The reverse order (this bundle before the aggregate) is a known limitation:
# the guard cannot see rows that come after it, and no runtime singleton guard
# is added. Same-id manual duplicates still fail loudly at the loader.
- insert:
    - id: octopus
      name: 'dsh-octopus-operation-space'
      disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.name === 'dsh-octopus-operation-space' && e.options.id !== 'octopus' && !e.disabled)"
