packages:
  - .

# No `allowBuilds` block: this package has no dependency that runs an install
# script. The workbench this plugin was cut from needed `node-pty` (the terminal
# tab), whose install script copies shipped prebuilt binaries into place — that
# dependency, and with it the approval entry, is gone. If a future dependency
# does need one, pnpm 11 fails the install loudly and names it, so adding the
# explicit `allowBuilds` entry then is a deliberate decision rather than a
# leftover.

# The @deepseek-ai/* packages declare their dsh-* siblings as peerDependencies
# (the DSH host bundle provides them all at mount time). This repo installs
# every peer the dev tree needs as a direct devDependency pinned to the
# baseline (see package.json), so pnpm resolves them instead of floating to
# stale copies. When bumping the DSH baseline, audit with `pnpm peers check`
# and hoist any newly-unmet transitive peers into devDependencies too.
#
# This package has NO runtime dependencies: the client bundle only consumes
# the platform module table (react / react-dom / cordis / dsh-client-ui-*),
# which DSH injects at mount time.

minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
